<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Scroll</title>
<style>
  html, body { margin: 0; background: #ffb86b; }
  #spacer { height: 600vh; }              /* gives us something to scroll */
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;           /* big chonky pixels */
  }
  h1 {
    position: fixed; left: 0; right: 0; bottom: 4vh; margin: 0; text-align: center;
    font: 700 clamp(18px, 4vw, 40px) monospace; color: #fff3d6;
    text-shadow: 3px 3px 0 #7a3b1d; pointer-events: none;
  }
</style>
</head>
<body>
<div id="spacer"></div>
<h1>scroll ↓↑</h1>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const PIXEL = 6;                          // each rendered pixel = 6 screen pixels
const SKY = 0xffb86b;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 12, 32);   // warm haze

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

// golden hour: low orange sun + warm ambient
scene.add(new THREE.HemisphereLight(0xffd9a0, 0x8a4a3a, 0.9));
const sun = new THREE.DirectionalLight(0xff9a3c, 3);
sun.position.set(-8, 4, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 8, bottom: -8, far: 40 });
scene.add(sun);

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 40),
  new THREE.MeshLambertMaterial({ color: 0xc9743f })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// objects, side by side on the ground
const shapes = [
  [new THREE.BoxGeometry(2, 2, 2),            0xe8553d, 1],
  [new THREE.SphereGeometry(1.2, 8, 6),       0xf2c14e, 1.2],
  [new THREE.ConeGeometry(1.2, 2.4, 5),       0x6fae5b, 1.2],
  [new THREE.TorusKnotGeometry(0.8, 0.3, 48, 8), 0x7b6cd9, 1.4],
  [new THREE.IcosahedronGeometry(1.3, 0),     0x4fb5c9, 1.3],
  [new THREE.CylinderGeometry(1, 1, 2, 6),    0xf08bb0, 1],
];
const GAP = 7;
const meshes = shapes.map(([geo, color, lift], i) => {
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color, flatShading: true }));
  m.position.set(i * GAP, lift, 0);       // sits on the ground
  m.castShadow = true;
  scene.add(m);
  return m;
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(Math.ceil(w / PIXEL), Math.ceil(h / PIXEL), false); // tiny buffer, CSS scales it up
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let smooth = 0;
renderer.setAnimationLoop((t) => {
  const max = document.body.scrollHeight - innerHeight;
  const p = max > 0 ? scrollY / max : 0;               // 0..1
  smooth += (p - smooth) * 0.08;                       // ease

  // scrolling pans the camera along the row; objects stay in place
  const x = smooth * (shapes.length - 1) * GAP;
  camera.position.set(x, 3.2, 11);
  camera.lookAt(x, 1.4, 0);

  meshes.forEach((m, i) => {
    m.rotation.y = t * 0.0006 + smooth * 12 + i;       // spin in place, faster while scrolling
    m.rotation.x = Math.sin(t * 0.0004 + i) * 0.15;
  });
  renderer.render(scene, camera);
});
</script>
</body>
</html>
